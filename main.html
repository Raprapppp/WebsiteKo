<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management</title>
</head>
<body>

    <h2>Student Management</h2>
    
    <a href="login.html">
        <button id="logout">LOGOUT</button>
    </a>

    <h3 id="formTitle">Register a Student</h3>

    <link rel="stylesheet" href="style.css">

    <form id="studentForm">
        <label>Student Name:</label>
        <input type="text" id="nameInput" required placeholder="e.g. Juan Dela Cruz">

        <br><br>

        <label>Student Email:</label>
        <input type="email" id="emailInput" required placeholder="youremail@email">

        <br><br>
<div class="option">
        <label>Program:</label>
        <select id="courseSelect" required>
            <option value="">Select a Program</option>
            <option value="BSIS">BS Information Systems</option>
            <option value="BSIT">BS Information Technology</option>
            <option value="BSTM">BS Tourism Management</option>
            <option value="CRIM">BS Criminology</option>
            <option value="ENGR">BS Computer Engineering</option>
        </select>
</div>
        <br><br>
<div class="button">
        <button type="submit" id="saveBtn">Add Student</button>
        <button type="button" id="cancelBtn" hidden>Reset</button>
</div>
    </form>

    <hr>

    <h3>Student List</h3>

    <table id="list" border="2" cellpadding="4">
        <thead>
            <tr>
                <th>Student Name</th>
                <th>Student Email</th>
                <th>Program</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="studentTable"></tbody>
    </table>

    <script src="script.js"></script>

</body>
</html>
